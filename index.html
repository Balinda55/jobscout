<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
       <title>JobScout - Find real jobs fast</title>
       <style>
         :root { --bg: #f4f6fb; --card: #fff; --text: #1d2433; --muted: #5e6a80; --brand: #2f5bea; --ok: #1f9d55; --error: #c62828; --border: #dde3ee; }
    * { box-sizing: border-box; } body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: var(--brand); color: #fff; padding: 2rem 1rem; text-align: center; } header h1 { margin: 0; font-size: 2.2rem; }
    header h1 span { color: #ffd84d; } header p { margin: .4rem 0 0; opacity: .9; }
    main {max-width: 960px; margin: 0 auto; padding: 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; font-size . 9rem; color: var(--muted); flex: 1 1 180px; };
    label.check { flex-direction: row; align-items: center; gap: .4rem; flex: 0 0 auto; align-self: flex-end; padding-bottom: .5rem; }
    input[type="text"], select { margin-top: .3rem; padding: .6rem .7rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    button { background: var(--brand); color: #fff; border: none; border-radius: 8px; padding:.7rem 1.4rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; } .status { min-height: 1.5rem; color:var(--muted); }
    .status.error { color: var(--error); font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
    .stat { background: var(--bg); border-radius: 10px; padding: .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
    .stat strong { display: block; font-size: 1.5rem; color: var(--brand); }
    .bar-row { display: grid: grid-template-columns: 90px 1fr 30px; align-items:center; gap: .5rem; font-size: .85rem; margin-top: .4rem; }
    .bar-track { background: var(--bg); border-radius: 999px; height: 12px; overflow: hidden; } .bar-fill { background: var(--brand) height: 100%; }
    .job { display: grid; grid-template-columns: 56px 1fr; gap: 1rem; }
    .logo {width: 56px; height: 56px; border-radius: 8px; object-fit: contain; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--brand) }
    .job h3 { margin: 0; font-size: 1.1rem; } .company { color: var(--muted); margin: .1rem 0 .5rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; } .tag { background: var(--bg); border-radius: 999px; padding: .15rem .6rem; font-size: .8rem; }
    .tag.remote { background: #e3f7ec; color: var(--ok); } .tag.salary { background: #fff5d6; }
    details summary { cursor: pointer; color: var(--brand); } details p{ white-space: pre-line; font-size: .9rem; }
    .actions { display: flex; gap: .5rem; margin-top: .5rem; }
    .actions a, .actions button { font-size: .9rem; padding: .45rem .9rem; border-radius: 8px; text-decoration: none; } .actions a { background: var(--brand); color: #fff; }
    .actions .save { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
    .actions .save.saved { background: #ffd84d; border-color: #ffd84d; color: var(--text); }
    .pager { display: flex; justify-content: center; align-items: center; gap: 1rem; } .hidden { display: none !important; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 1rem; } @media (max-width: 600px) { .job { grid-template-columns: 1fr; } }
           </style>
    </head>
    <body>
        <header>
            <h1> Job<span>Scout</span></h1><p>Search live job Listings form LinkedIn, Indeed, Glassdoor and more, in one place.</p>
        </header>
        <main>
            <form id="search-form" class="card" novalidate>
                <div class="row">
                    <label>Job title or keyword <input id="query" type="text" placeholder="e.g. software engineer" maxlength="100"/></label>
                    <label>Location (optional) <input id="location" type="text" placeholder=". Kigali" maxlength="60" </label>
                </div>
                <div class="row">
                    <label>Country <select id="country"></select></label>
                    <label>Date posted <select id="date_posted"></select></label>
                    <label>Job type  <select id="type"></select></label>
                    <label class="check"><input id="remote" type="checkbox"/> Remote only</label>
                </div>
                <button type="submit" id="search-btn">Search jobs</button>
            </form>
            <section id="toolbar" class="card row hidden">
                <label>Filter results <input id="filter type="text" placeholder="Filter by company, title or city" /></label>
                <label>Sort by <select id="sort"></select></label>
                <label class="check"><input id="saved-only" type="checkbox" />Saved jobs only</label></section>
                <section id="summary" class="card hidden">
                    <strong>Results overview</strong><div id="stats" class="stats"></div><div id="bars"</div>
                </section>
                <p id="status" class="status" role="status" arian-live="polite"></p><section id="results"></section>
                <div id="pager" class="pager hidden">
                    <button id="prev" type="button">← Previous</button> <span id="Page 1"</span> <button id="next" type"button">Next→</button>
                </div>
        </main>
        <footer>
            <p>Job data <a href="https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch"</p> target="_blank" rel="noopener">JSearch API (OpenWeb Ninja) on RapidAPI</a>.</p>
            <p>Served by: <strong id="served-by">...</strong></p>
        </footer>
        <script>
            const $ = (id) => document.getElementById(id);
            const TYPES = { FULLTIME: 'Full-time', PARTTIME: 'Part-time', CONTRACTOR: 'Contract', INTERN: 'Internship' };
            const OPTIONS= {
                country: {'': 'Any', rw: 'Rwanda', ke: 'Kenya', ng: 'Nigeria',za: 'South Africa', us: 'United States', gb: 'United Kingdom', ca: 'Canada', de: 'Germany', fr: 'France', in: 'India', au: 'Autralia' };
                date_posted: { all: 'Any time', today: 'Today', '3 days': 'Last 3 days', week: 'Last week', month: 'Last month' };
                type: { '': 'Any', ...TYPES },
                sort: {newest: 'Newest first', oldest: 'Oldest first', salary: 'Highest salary', company: 'Company A-Z', title: 'Job title A-Z' },
            };
            const state = { jobs: [], page: 1, saved: {} };
            try { state.saved = JSON.parse(localStorage.getItem('jobscout-saved')) || {}; } catch {}
            function el(tag, className, text) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (text !== undefined) node.textContent = text; return node;
            }
            function setStatus(msg, isError = false) {
                $('status').textContent =msg; $('status').classList.toggle('error', isError);
            }
            for (const [id, opts] of Object.entries(OPTIONS)) {
                for (const [value, label] of Object.entries(opts)) $(id).append(new Option(label, value));
            }
            async function search(page =1) {
                const query =$('query').value.trim();
                if (query.length.length <2) return setStatus('Please type at least 2 characters for the job title or keyword.', true);
                const params = new URLSearchParams({
                    query, location: $('location').value.trim(), country: $('country').value, date_posted: $('date_posted').value,
                    type: $('type').value, remote: String($('remote').checked), page: String(page),
                });
                $('search-btn').disabled = true; setStatus('Searching for jobs...');
                try {
                    const res = await fetch('/api/jobs?${params}');
                    const data = await res.json().catch(() => ({}));
                    $('served-by').textContent = res.headers.get('X-Served-By') || data.server || '...';
                    if (!res.ok) throw new Error(data.error || 'Something went wrong (status ${res.status}).');
                    state.jobs = data.jobs; state.page = data.page;
                    $('toolbar').classList.remove('hidden');
                   setStatus(data.jobs.length ? `Found ${data.jobs.length} jobs on page ${data.page}${data.cached ? ' (from cache)' : ''}.` : 'No jobs found. Try another keyword or fewer filters.');
                } catch (err) {
                    state.jobs = [];
                    setStatus(err.message || 'Network error. Check your connection and try again.', true);
      } finally { $('search-btn').disabled = false; render(); }
                }
                function visibleJobs() {
                    const text =$('filter').value.trim().toLowerCase();
                    let list = $('saved-only').checked ? Object.values(state.saved) : [...state.jobs];
                    if(text) list = list.filters((j) => [j.title, j.company, j.city, j.country].join(' ').toLowerCase().includes(text));
                    const time = (j) => (j.postedAt ? new Date(j.postedAt).getTime() : 0), pay = (j) => j.maxSalary  || j.minSalary || 0;
                    const sorters = {
                        newest: (a, b) => time(b) - time(a), oldest: (a, b) => time(a) - time(b), salary: (a, b) => pay(b) - pay(a),
                        company: (a, b) => a.company.localeCompare(b.company), title: (a, b) => a.title.localeCompare(b.title),
                    };
                    return list.sort(sorters[$('sort').value]);
                }
                function salaryText(j) {
                    if (!j.minSalary && !j.maxSalary) return null;
                   const fmt = (n) => Math.round(n).toLocaleString();
      const range = j.minSalary && j.maxSalary ? `${fmt(j.minSalary)}–${fmt(j.maxSalary)}` : fmt(j.minSalary || j.maxSalary);
      return `${j.salaryCurrency} ${range}${j.salaryPeriod ? ' / ' + j.salaryPeriod.toLowerCase() : ''}`.trim(); 
                }
                function timeAgo(iso) {
                    if (!iso) return 'Date unknown';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      return days <= 0 ? 'Posted today' : days === 1 ? 'Posted yesterday' : `Posted ${days} days ago`;
                }
                function jobCard(j) {
      const card = el('article', 'card job'), fallback = () => el('div', 'logo', j.company[0] || '?');
      if (j.logo && j.logo.startsWith('https://')) {
        const img = el('img', 'logo');
        Object.assign(img, { src: j.logo, alt: `${j.company} logo`, loading: 'lazy', onerror: () => img.replaceWith(fallback()) }); card.append(img);
      } else card.append(fallback());
      const body = el('div'); body.append(el('h3', '', j.title), el('p', 'company', j.company));
      const tags = el('div', 'tags'), place = [j.city, j.country].filter(Boolean).join(', ');
      if (place) tags.append(el('span', 'tag', place));
      if (place) tags.append(el('span', 'tag', place));
      if (j.remote) tags.append(el('span', 'tag remote', 'Remote'));
      if (j.type) tags.append(el('span', 'tag', TYPES[j.type] || j.type));
      if (salaryText(j)) tags.append(el('span', 'tag salary', salaryText(j)));
      tags.append(el('span', 'tag', timeAgo(j.postedAt))); body.append(tags);
      if (j.description) {
        const details = el('details'); details.append(el('summary', '', 'Show description'), el('p', '', j.description));
         body.append(details);
      }
      const actions = el('div', 'actions');
      if (j.applyLink && /^https?:\/\//.test(j.applyLink)) {
        const a = el('a', '', 'Apply ↗');
        Object.assign(a, { href: j.applyLink, target: '_blank', rel: 'noopener noreferrer' }); actions.append(a);
         }
      const saved = Boolean(state.saved[j.id]);
      const btn = el('button', saved ? 'save saved' : 'save', saved ? '★ Saved' : '☆ Save'); btn.type = 'button';
      btn.onclick = () => {
        if (state.saved[j.id]) delete state.saved[j.id]; else state.saved[j.id] = j;
        try { localStorage.setItem('jobscout-saved', JSON.stringify(state.saved)); } catch {} render();
      };
      actions.append(btn); body.append(actions); card.append(body); return card;
    }
    function renderSummary(list) {
      $('summary').classList.toggle('hidden', !list.length); if (!list.length) return;
      const stats = [[list.length, 'Jobs shown'], [new Set(list.map((j) => j.company)).size, 'Companies'],
       [`${Math.round((list.filter((j) => j.remote).length / list.length) * 100)}%`, 'Remote'], [list.filter(salaryText).length, 'Show salary']];
      $('stats').replaceChildren(...stats.map(([value, label]) => { const s = el('div', 'stat', label); s.prepend(el('strong', '', String(value))); return s; }));
      const counts = {}; list.forEach((j) => { const k = TYPES[j.type] || 'Other'; counts[k] = (counts[k] || 0) + 1; });
      const max = Math.max(...Object.values(counts));
      $('bars').replaceChildren(...Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([label, count]) => {
        const row = el('div', 'bar-row'), track = el('div', 'bar-track'), fill = el('div', 'bar-fill');
        fill.style.width = `${(count / max) * 100}%`; track.append(fill);
        row.append(el('span', '', label), track, el('span', '', String(count))); return row;
      }));
    }
    function render() {
      const list = visibleJobs(), savedOnly = $('saved-only').checked;
      renderSummary(list);
      $('results').replaceChildren(...list.map(jobCard));
      if (savedOnly && !list.length) $('results').append(el('p', 'status', 'No saved jobs yet. Click "☆ Save" on a job to keep it here.'));
      $('pager').classList.toggle('hidden', savedOnly || !state.jobs.length);
      $('page-label').textContent = `Page ${state.page}`;
      $('prev').disabled = state.page <= 1; $('next').disabled = state.page >= 10;
    }
    $('search-form').addEventListener('submit', (e) => { e.preventDefault(); search(1); });
    ['filter', 'sort', 'saved-only'].forEach((id) => $(id).addEventListener(id === 'filter' ? 'input' : 'change', render));
    $('prev').addEventListener('click', () => { search(state.page - 1); scrollTo(0, 0); });
    $('next').addEventListener('click', () => { search(state.page + 1); scrollTo(0, 0); });
    fetch('/api/health').then((r) => r.json()).then((d) => { $('served-by').textContent = d.server; })
      .catch(() => { $('served-by').textContent = 'unreachable'; };
      </script>
    </body>
</html>
